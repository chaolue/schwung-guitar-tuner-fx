name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Offline tests (DSP, contract, help, canvas)
        run: bash tests/run_tests.sh

      - name: Cross-compile for the Move (aarch64)
        run: |
          ./scripts/build.sh
          file build/guitar-tuner-fx.so | grep -q 'ARM aarch64'
